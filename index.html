<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1315">
<meta name="description" content="판타지 탑뷰 핵앤슬래시 로그라이크 던전 RPG">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>던전 슬레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;900&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed canvas cave. Menu = nav | content | hero panel floating over living slimes. In-run HUD hugs corners, controls own the bottom edge. */
:root{
  --bg:#0c1315; --cave:#14211f; --panel:rgba(19,31,31,.93); --panel-solid:#152323; --panel-2:#1c2d2d;
  --line:#2f4744; --fg:#efe6d2; --muted:#9bb0a7; --gold:#e3b04b; --gold-deep:#8e6420;
  --hp:#d8574b; --mp:#4b8fe2; --xp:#b48cf0; --slime:#8bd870; --violet:#9b7cf0; --danger:#ff7a63;
  --gold-hi:#f7dc95; --gold-line:rgba(227,176,75,.34); --ink:#0a1011;
  --display:'Hahmlet','Noto Serif KR','Apple SD Gothic Neo',serif;
  --body:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;background:var(--bg)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- MENU ---------- */
/* 모든 UI 치수는 --u(화면 크기에 비례하는 1단위) 배수로 계산: 760×380 기준 1px */
#app{--u:1px;container-type:size;container-name:app}
#menu{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:calc(var(--u)*8);
  padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*8);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*8);
  padding-left:max(calc(var(--u)*12),env(safe-area-inset-left,0px));padding-right:max(calc(var(--u)*12),env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:calc(var(--u)*10);min-width:0}
.logo{font-family:var(--display);font-weight:900;font-size:calc(var(--u)*24);letter-spacing:.01em;line-height:1;position:relative;flex:none;white-space:nowrap}
.logo b{background:linear-gradient(180deg,#fff1c4 0%,#f0c463 45%,#b07a26 55%,#e9b955 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #2a1d07) drop-shadow(0 0 14px rgba(227,176,75,.28))}
.ver{display:inline-block;margin-left:calc(var(--u)*6);vertical-align:middle;font-family:var(--body);font-size:calc(var(--u)*9);font-weight:400;letter-spacing:.06em;color:var(--gold-hi);border:1px solid var(--gold-line);border-radius:4px;padding:0 calc(var(--u)*5);background:rgba(227,176,75,.08)}
.logo small{display:block;font-size:calc(var(--u)*7.5);letter-spacing:.32em;color:var(--muted);font-weight:500;margin-top:calc(var(--u)*3);text-shadow:none}
.res{margin-left:auto;display:flex;gap:calc(var(--u)*5);flex-wrap:nowrap;min-width:0;overflow:hidden}
.aud{display:flex;gap:calc(var(--u)*5);flex:none}
.abtn{background:linear-gradient(180deg,rgba(30,44,44,.95),rgba(14,22,23,.95));border:1px solid var(--gold-line);border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*9);font-size:calc(var(--u)*11);line-height:1.2;color:var(--muted);white-space:nowrap}
.abtn[aria-pressed="true"]{color:var(--gold-hi);border-color:rgba(227,176,75,.6)}
.abtn.inst{background:linear-gradient(180deg,#fbe3a0,#c48d2e);color:#2a1a06;border-color:#fff0bf;font-weight:700}
.chip{background:linear-gradient(180deg,rgba(30,44,44,.95),rgba(14,22,23,.95));border:1px solid var(--gold-line);box-shadow:inset 0 1px 0 rgba(247,220,149,.08);border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*8);font-size:calc(var(--u)*11);line-height:1.2;display:flex;gap:calc(var(--u)*5);align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.dot{width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;display:inline-block;flex:none}
.mbody{display:grid;grid-template-columns:calc(var(--u)*92) minmax(0,1fr) calc(var(--u)*170);gap:calc(var(--u)*8);min-height:0}
.nav{display:flex;flex-direction:column;gap:calc(var(--u)*4);min-height:0;overflow:auto}
.nav button{position:relative;background:transparent;border:1px solid transparent;border-radius:8px;padding:calc(var(--u)*8) calc(var(--u)*8) calc(var(--u)*8) calc(var(--u)*22);text-align:left;font-family:var(--display);font-weight:700;font-size:calc(var(--u)*14);line-height:1.2;color:var(--muted);white-space:nowrap}
.nav button::before{content:'';position:absolute;left:calc(var(--u)*9);top:50%;width:calc(var(--u)*6);height:calc(var(--u)*6);margin-top:calc(var(--u)*-3);transform:rotate(45deg);border:1px solid rgba(155,176,167,.35)}
.nav button[aria-selected="true"]{background:linear-gradient(90deg,rgba(227,176,75,.16),rgba(227,176,75,0));border-color:var(--gold-line);color:var(--gold-hi)}
.nav button[aria-selected="true"]::before{background:var(--gold);border-color:var(--gold-hi);box-shadow:0 0 8px var(--gold)}
.content{overflow:auto;padding:calc(var(--u)*14) calc(var(--u)*12) calc(var(--u)*12);min-width:0;min-height:0;overscroll-behavior:contain;touch-action:pan-x pan-y;font-size:calc(var(--u)*12)}
.side{padding:calc(var(--u)*14) calc(var(--u)*10) calc(var(--u)*10);display:flex;flex-direction:column;gap:calc(var(--u)*6);min-height:0;min-width:0}
/* ornate frame shared by panels & cards */
.frame{position:relative;background:linear-gradient(180deg,rgba(27,41,41,.95),rgba(12,19,20,.97));border:1px solid var(--gold-line);border-radius:calc(var(--u)*12);
  box-shadow:inset 0 0 0 3px rgba(5,9,10,.55),inset 0 0 0 4px rgba(227,176,75,.10),inset 0 1px 0 rgba(247,220,149,.12),0 12px 34px rgba(0,0,0,.5)}
.frame::before,.frame::after{content:'';position:absolute;width:calc(var(--u)*7);height:calc(var(--u)*7);transform:rotate(45deg);background:linear-gradient(135deg,var(--gold-hi),var(--gold-deep));top:calc(var(--u)*4);box-shadow:0 0 6px rgba(227,176,75,.5);pointer-events:none}
.frame::before{left:calc(var(--u)*14)}.frame::after{right:calc(var(--u)*14)}
/* 던전 선택 */
.dgsel{display:flex;align-items:center;gap:calc(var(--u)*4);flex:none}
.dgsel span{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--u)*12.5);color:var(--gold-hi);line-height:1.2;white-space:nowrap}
.dgsel span small{display:block;font-family:var(--body);font-weight:400;font-size:calc(var(--u)*9);color:var(--muted)}
.dgsel button{flex:none;width:calc(var(--u)*28);height:calc(var(--u)*30);display:grid;place-items:center;background:linear-gradient(180deg,rgba(30,44,44,.95),rgba(14,22,23,.95));border:1px solid var(--gold-line);border-radius:calc(var(--u)*7);padding:0;font-size:calc(var(--u)*11);color:var(--gold-hi)}
.dgsel button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:linear-gradient(90deg,rgba(227,176,75,.18),rgba(227,176,75,.04))}
#preview{width:100%;flex:1 1 0;min-height:calc(var(--u)*40);display:block}
.hname{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*16);display:flex;align-items:baseline;gap:calc(var(--u)*6);flex-wrap:wrap;line-height:1.2}
.hname span{font-size:calc(var(--u)*10.5);color:var(--muted);font-family:var(--body)}
.xpbar{height:calc(var(--u)*5);background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;flex:none}
.xpbar i{display:block;height:100%;background:var(--xp)}
.enter{position:relative;overflow:hidden;flex:none;background:linear-gradient(180deg,#fbe3a0 0%,#e9b453 48%,#c48d2e 52%,#d9a246 100%);color:#2a1a06;border:1px solid #fff0bf;border-radius:calc(var(--u)*10);padding:calc(var(--u)*10) calc(var(--u)*8);font-family:var(--display);font-weight:900;font-size:calc(var(--u)*14);line-height:1.2;letter-spacing:.03em;white-space:nowrap;
  box-shadow:0 3px 0 var(--gold-deep),0 0 0 3px rgba(10,16,17,.9),0 0 0 4px var(--gold-line),0 8px 22px rgba(227,176,75,.22);text-shadow:0 1px 0 rgba(255,240,190,.6)}
.enter::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.enter:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.sub{font-size:calc(var(--u)*10.5);color:var(--muted);line-height:1.35}
h2{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*16);margin:0 0 calc(var(--u)*10);text-wrap:balance;display:flex;align-items:center;gap:calc(var(--u)*8);color:var(--gold-hi);line-height:1.25}
h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}
h3{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*13);margin:calc(var(--u)*12) 0 calc(var(--u)*6);color:var(--gold);letter-spacing:.02em}
h3:first-child{margin-top:0}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*112),1fr));gap:calc(var(--u)*6)}
.hcard{background:linear-gradient(180deg,#1f3131,#141f20);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7);display:grid;gap:calc(var(--u)*3);text-align:left;min-width:0}
.hcard[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#3a3320,#1d1a10);box-shadow:0 0 0 1px rgba(227,176,75,.4),0 0 18px rgba(227,176,75,.18)}
.hcard canvas{width:100%;height:calc(var(--u)*50)}
.hcard b{font-family:var(--display);font-size:calc(var(--u)*13.5)}
.hcard small{color:var(--muted);font-size:calc(var(--u)*10);line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*128),1fr));gap:calc(var(--u)*3) calc(var(--u)*12);font-size:calc(var(--u)*11.5);font-variant-numeric:tabular-nums}
.stats div{display:flex;justify-content:space-between;gap:calc(var(--u)*6);border-bottom:1px dashed rgba(155,176,167,.18);padding:calc(var(--u)*3) 0}
.stats div span:first-child{color:var(--muted)}
.stats .strong span:last-child{color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*104),1fr));gap:calc(var(--u)*6)}
.slot{background:linear-gradient(180deg,#1f3131,#141f20);border:1px solid var(--line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7);min-height:calc(var(--u)*70);display:flex;flex-direction:column;gap:calc(var(--u)*3);font-size:calc(var(--u)*10);text-align:left;min-width:0}
.slot .lab{color:var(--muted);font-size:calc(var(--u)*9);letter-spacing:.1em}
.slot b{font-size:calc(var(--u)*11.5);font-family:var(--display)}
.slot.empty b{color:var(--muted);font-weight:500}
.list{display:grid;gap:calc(var(--u)*6)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:calc(var(--u)*6) calc(var(--u)*8);background:linear-gradient(180deg,#1d2e2e,#131d1e);border:1px solid var(--line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7) calc(var(--u)*9);font-size:calc(var(--u)*11.5)}
.row .grow{flex:1 1 calc(var(--u)*150);min-width:0}
.row .nm{font-family:var(--display);font-weight:700}
.row .st{color:var(--muted);font-size:calc(var(--u)*10)}
.btn{background:#26393a;border:1px solid var(--line);border-radius:calc(var(--u)*8);padding:calc(var(--u)*6) calc(var(--u)*10);font-size:calc(var(--u)*11);line-height:1.2;white-space:nowrap}
.btn.gold{background:linear-gradient(180deg,#4a3d22,#2b2413);border-color:#8a6a2c;color:var(--gold-hi);box-shadow:inset 0 1px 0 rgba(247,220,149,.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tierhead{display:flex;flex-wrap:wrap;gap:calc(var(--u)*3) calc(var(--u)*10);align-items:baseline;margin:calc(var(--u)*12) 0 calc(var(--u)*6)}
.tierhead:first-child{margin-top:0}
.tierhead b{font-family:var(--display);font-size:calc(var(--u)*13.5)}
.tierhead span{font-size:calc(var(--u)*10.5);color:var(--muted)}
.forge{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*104),1fr));gap:calc(var(--u)*6)}
.forge button{background:linear-gradient(180deg,#1f3131,#141f20);border:1px solid var(--line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*7);text-align:left;display:grid;align-content:start;gap:calc(var(--u)*3);font-size:calc(var(--u)*10);min-width:0}
.forge button b{font-family:var(--display);font-size:calc(var(--u)*12)}
.forge button small{color:var(--muted);font-size:calc(var(--u)*9.5);line-height:1.35}
.forge button:disabled{opacity:.45}
.skill{display:grid;grid-template-columns:calc(var(--u)*38) minmax(0,1fr) auto;gap:calc(var(--u)*8);align-items:center;background:linear-gradient(180deg,#1d2e2e,#131d1e);border:1px solid var(--line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8)}
.sico{width:calc(var(--u)*38);height:calc(var(--u)*38);border-radius:50%;display:grid;place-items:center;color:#e9f2ee;background:radial-gradient(circle at 35% 28%,#4a6b68,#132020 70%);box-shadow:0 0 0 2px #0a1011,0 0 0 3px rgba(200,210,200,.35),inset 0 -4px 8px rgba(0,0,0,.5)}
.sico svg,.sbtn svg{width:calc(var(--u)*20);height:calc(var(--u)*20);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sico.ult{color:var(--gold-hi);background:radial-gradient(circle at 35% 28%,#7a5f2a,#1e160a 70%);box-shadow:0 0 0 2px #0a1011,0 0 0 3px var(--gold),inset 0 -4px 8px rgba(0,0,0,.5)}
.skill .nm{font-family:var(--display);font-weight:700;font-size:calc(var(--u)*13)}
.skill .nm em{font-style:normal;color:var(--gold);font-size:calc(var(--u)*11);margin-left:calc(var(--u)*5)}
.skill p{margin:calc(var(--u)*2) 0 0;font-size:calc(var(--u)*10.5);color:var(--muted);line-height:1.45}
.bon{display:flex;flex-wrap:wrap;gap:calc(var(--u)*4);margin-top:calc(var(--u)*4)}
.bon span{font-size:calc(var(--u)*9.5);padding:calc(var(--u)*1) calc(var(--u)*6);border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.bon span.on{border-color:#5d7a3c;color:var(--slime);background:rgba(139,216,112,.08)}
.note{font-size:calc(var(--u)*10.5);color:var(--muted);line-height:1.55}
@container app (max-width:600px){
  .mbody{grid-template-columns:calc(var(--u)*78) minmax(0,1fr) calc(var(--u)*140)}
  .nav button{font-size:calc(var(--u)*13);padding-left:calc(var(--u)*18)}
  .nav button::before{left:calc(var(--u)*6)}
  .logo small{display:none}
}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.hstat{position:absolute;left:calc(env(safe-area-inset-left,0px) + var(--u)*10);top:calc(env(safe-area-inset-top,0px) + var(--u)*8);width:calc(var(--u)*228);display:grid;grid-template-columns:calc(var(--u)*46) minmax(0,1fr);gap:calc(var(--u)*3) calc(var(--u)*8);align-items:center}
.portrait{grid-row:span 4;width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:50%;background:radial-gradient(circle at 50% 35%,#2c4140,#0b1213);box-shadow:0 0 0 2px #0a1011,0 0 0 3px var(--gold),0 0 0 4.5px rgba(10,16,17,.9),0 4px 14px rgba(0,0,0,.6);position:relative}
.portrait canvas{width:100%;height:100%;border-radius:50%;display:block}
.portrait b{position:absolute;bottom:calc(var(--u)*-6);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:calc(var(--u)*9);background:linear-gradient(180deg,#4a3d22,#1e180c);border:1px solid var(--gold);color:var(--gold-hi);border-radius:8px;padding:0 calc(var(--u)*5);line-height:calc(var(--u)*13);white-space:nowrap}
.hstat .buffs{grid-column:1/-1;margin-top:calc(var(--u)*4)}
.hline{display:flex;align-items:baseline;gap:calc(var(--u)*6);font-family:var(--display);font-weight:700;font-size:calc(var(--u)*12);line-height:1.1;text-shadow:0 1px 2px #000}
.bar{height:calc(var(--u)*12);background:linear-gradient(180deg,#05090a,#121b1c);border:1px solid rgba(227,176,75,.38);border-radius:calc(var(--u)*6);position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 1px 3px rgba(0,0,0,.8)}
.bar::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
.bar i{position:absolute;inset:0;transform-origin:left center;background:linear-gradient(180deg,#f07a6c,#c2382e 60%,#8e231c);transition:transform .12s}
.bar.mp i{background:linear-gradient(180deg,#7ab3ff,#3473c9 60%,#1f4f93)}
.bar.xp{height:calc(var(--u)*5);border-radius:3px}
.bar.xp i{background:linear-gradient(90deg,#8b62d8,#d2b4ff)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--u)*9);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px #000}
.buffs{display:flex;gap:calc(var(--u)*4);flex-wrap:wrap;min-height:calc(var(--u)*14)}
.buffs span{font-size:calc(var(--u)*9);line-height:1.3;padding:0 calc(var(--u)*6);border-radius:4px;background:linear-gradient(180deg,rgba(60,48,22,.85),rgba(20,15,6,.85));border:1px solid rgba(227,176,75,.5);color:var(--gold-hi)}
#flr{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + var(--u)*8);display:flex;align-items:baseline;gap:calc(var(--u)*8);white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:calc(var(--u)*12);line-height:1.2;padding:calc(var(--u)*4) calc(var(--u)*12);border-radius:999px;background:linear-gradient(180deg,rgba(30,44,44,.85),rgba(8,14,14,.85));border:1px solid var(--gold-line);text-shadow:0 1px 2px #000}
#flr small{font-family:var(--body);font-weight:400;font-size:calc(var(--u)*10);color:var(--gold)}
.tr{position:absolute;right:calc(env(safe-area-inset-right,0px) + var(--u)*10);top:calc(env(safe-area-inset-top,0px) + var(--u)*8);display:flex;gap:calc(var(--u)*7);align-items:flex-start}
#mini{width:calc(var(--u)*84);height:calc(var(--u)*84);border:1px solid var(--gold);background:radial-gradient(circle,rgba(14,24,24,.8),rgba(4,8,9,.85));border-radius:calc(var(--u)*7);display:block;box-shadow:0 0 0 2px rgba(10,16,17,.9),0 0 0 3px var(--gold-line),0 6px 16px rgba(0,0,0,.5)}
#pauseBtn{pointer-events:auto;width:max(30px,calc(var(--u)*34));height:max(30px,calc(var(--u)*34));padding:0;border-radius:calc(var(--u)*8);background:linear-gradient(180deg,#2a3a3a,#0f1819);border:1px solid var(--gold);color:var(--gold-hi);font-size:calc(var(--u)*12);font-weight:900;box-shadow:0 0 0 2px rgba(10,16,17,.9),0 4px 10px rgba(0,0,0,.5)}

function tplDesc2(sp,lv,dm,st){const nm=sp.nm||'';const up=lv>=3;switch(sp.t){

  case'barrage':return `지정 범위에 ${nm} ${(sp.n||6)+(up?2:0)}발이 차례로 떨어져 각각 ${dm}${sp.seek?' · 적을 노림':''}`;}return ''}
function tplBonus(sp){const B2={orbit:'개수 +1',boomer:'크기 +30%',wave:'분출 +2',mine:'설치 +1',summon:'지속시간 +2초',mark:'범위 +20%',blink:'범위 +20%',blinkchain:'대상 +2',parry:'지속시간 +1초',beam:'지속시간 +1초',barrage:'타격 +2'};if(B2[sp.t])return [B2[sp.t],'피해 +25%','쿨타임 -25%'];const a=sp.t==='bolt'&&(sp.n||1)>1?'투사체 +2':sp.t==='chain'?'대상 +2':sp.t==='dash'?'거리 +30%':sp.t==='buff'?'지속시간 +2초':sp.t==='exec'?'피해 +10%':'범위 +20%';return [a,'피해 +25%','쿨타임 -25%']}

function tDmg(sp,lv,m=1){const mag=tMag(sp),v=(mag?ap():atk())*sp.m*tplVal(lv)*m*(sp.t==='exec'&&lv>=3?1.1:1);const o=mag?{magic:v}:{phys:v};o.el=sp.el||formEl()||undefined;if(sp.apen)o.armorPen=sp.apen;if(sp.crit)o.critBonus=sp.crit;if(sp.ls)o.lifesteal=sp.ls;if(sp.knock)o.knock=sp.knock;return o}

function drawSlime(c,x,y,r,col,t,o={}){

  c.translate(0,-jump);
  const w=r*(1+sq),h=r*(1-sq)*.95;

function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume().catch(()=>{});return}

  AU.bgm=c.createGain();AU.bgm.connect(AU.master);AU.sfx=c.createGain();AU.sfx.connect(AU.master);
  AU.bgm.gain.value=AU.set.bgm?.3:0;AU.sfx.gain.value=AU.set.sfx?.55:0;

function schedStep(S,step,t,sd){
  const bar=Math.floor(step/16)%S.prog.length,st=step%16,[root,q]=S.prog[bar],ch=CHD[q],D=AU.bgm;
  if(st===0&&S.pad)for(const n of ch)tone({f:mtof(root+12+n),dur:sd*16,type:'triangle',vol:S.pad,a:sd*3,lp:1400,dest:D,t});
  if(S.bass[st]==='x')tone({f:mtof(root-12),dur:sd*1.8,type:S.bassType,vol:S.bassVol,lp:500,dest:D,t});
  if(S.arp[st]==='x'){const seq=[0,1,2,1,2,0,1,2];tone({f:mtof(root+ch[seq[st%8]]+(st>=8?24:12)),dur:sd*1.6,type:S.arpType,vol:S.arpVol,lp:2400,dest:D,t})}
  if(S.kick[st]==='x')tone({f:120,f2:40,dur:.18,vol:.35,dest:D,t});
  if(S.hat[st]==='x')noise({ft:'highpass',f:7000,dur:.04,vol:.06,dest:D,t});
  if(S.snare[st]==='x')noise({f:1800,dur:.14,vol:.18,q:.7,dest:D,t});
  if(S.drip&&st===0&&Math.random()<.5)tone({f:mtof(84+pick([0,3,7])),f2:mtof(79),dur:.4,vol:.04,dest:D,t:t+sd*6});
}
function music(name){if(AU.cur===name)return;AU.cur=name;AU.step=0;if(AU.ctx)AU.next=AU.ctx.currentTime+.15}
setInterval(()=>{if(!AU.ctx||!AU.cur||AU.ctx.state!=='running')return;const S=SONGS[AU.cur],sd=60/S.bpm/4,now=AU.ctx.currentTime;if(AU.next<now-.3)AU.next=now+.05;if(!AU.set.bgm){AU.next=now+.1;return}while(AU.next<now+.3){schedStep(S,AU.step,AU.next,sd);AU.next+=sd;AU.step++}},50);

    c.fillStyle='#ff8a3d';for(let i=0;i<4;i++){c.beginPath();c.moveTo(-8+i*4,-3);c.lineTo(-6+i*4,-9-Math.abs(fl)*1.5);c.lineTo(-4+i*4,-3);c.fill()}c.fillStyle='#ffd34d';ell(c,13,-2,1.2,1.2);c.fill();ell(c,13,2,1.2,1.2);c.fill()}
  else{if(ty==='imp'||ty==='gargoyle'||ty==='demonlord')dWings(c,ty==='gargoyle'?'#55555c':ty==='demonlord'?'#2a0a10':'#7a2010',ty==='demonlord'?26:ty==='gargoyle'?20:14,ty==='gargoyle'?0:fl);

    c.fillStyle='#2a1414';ell(c,-2+step*3,5.5,3,2.2);c.fill();ell(c,-2-step*3,-5.5,3,2.2);c.fill();
    c.save();

    else if(ty==='dknight'||ty==='demonlord'){c.fillStyle='#1a1414';c.fillRect(0,7,7,3.4);c.fillStyle=ty==='demonlord'?'#ff6a2a':'#8a1a1a';c.beginPath();c.moveTo(8,6);c.lineTo(36,7.2);c.lineTo(40,8.7);c.lineTo(36,10.2);c.lineTo(8,11.4);c.closePath();c.fill();if(ty==='demonlord'){c.fillStyle='rgba(255,170,60,.5)';ell(c,24,8.7,14,4);c.fill()}}

const ZPAL={zombie:'#7d9a6a',runner:'#8a8f86',bloater:'#6f8f4a',spitter:'#7a9a5a',crawler:'#7d9a6a',brute:'#6a7a5a',plague:'#5f7f3a'};
function drawZom(c,e,t,o){const r=e.r,ty=e.type,skin=ZPAL[ty]||'#7d9a6a',f=o.face||0,step=o.moving?Math.sin(t*(ty==='runner'?16:6)+e.x*.07):0;

    c.strokeStyle=skin;c.lineWidth=3;c.beginPath();c.moveTo(4,10);c.lineTo(12+step*2,12);c.moveTo(4,-10);c.lineTo(12-step*2,-12);c.stroke();c.fillStyle=skin;ell(c,10,0,5,5);c.fill();c.fillStyle='#e8f060';ell(c,13,-1.8,1,1);c.fill();ell(c,13,1.8,1,1);c.fill();
    if(ty==='plague'){c.fillStyle='#e6dfcc';for(let i=0;i<5;i++){const a=Math.PI*.6+i*Math.PI*.2;c.beginPath();c.moveTo(10+Math.cos(a)*4,Math.sin(a)*4);c.lineTo(10+Math.cos(a)*9,Math.sin(a)*9);c.lineTo(10+Math.cos(a+.2)*4,Math.sin(a+.2)*4);c.fill()}c.strokeStyle='#5a5f66';c.lineWidth=1.4;c.beginPath();c.arc(0,0,12.5,1,2.5);c.stroke()}}
  else if(ty==='crawler'){c.fillStyle='#4a5a6a';ell(c,-2,0,7,6);c.fill();c.strokeStyle=skin;c.lineWidth=2.4;c.beginPath();c.moveTo(2,5);c.lineTo(13+step*3,7);c.moveTo(2,-5);c.lineTo(13-step*3,-7);c.stroke();c.fillStyle=skin;ell(c,5,0,4.5,4.5);c.fill();c.fillStyle='#e8f060';ell(c,7.5,-1.5,.9,.9);c.fill();ell(c,7.5,1.5,.9,.9);c.fill()}
  else{c.fillStyle='#4a4238';ell(c,-2+step*3,5.5,3,2.2);c.fill();ell(c,-2-step*3,-5.5,3,2.2);c.fill();
    c.fillStyle=ty==='brute'?'#5a3a2a':ty==='runner'?'#3a3a3a':'#4a5a6a';ell(c,0,0,ty==='brute'?9:7.5,ty==='brute'?12:10);c.fill();c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-3,-4,2,6);
    c.strokeStyle=skin;c.lineWidth=2.6;c.beginPath();c.moveTo(0,7);c.lineTo(15+step*2,6);c.moveTo(0,-7);c.lineTo(15-step*2,-6);c.stroke();c.fillStyle=skin;ell(c,15+step*2,6,1.8,1.8);c.fill();ell(c,15-step*2,-6,1.8,1.8);c.fill();

    c.fillStyle=skin;ell(c,2,0,6,6);c.fill();c.fillStyle='#2a2a22';c.beginPath();c.arc(1,0,6.2,Math.PI*.7,Math.PI*1.2);c.fill();c.fillStyle='#e8f060';ell(c,5.5,-2.2,1.1,1.1);c.fill();ell(c,5.5,2.2,1.1,1.1);c.fill()}

const SKPAL={skel:'#ddd5c2',shield:'#d2cab5',hound:'#d8d0bc',sarcher:'#d6cfbb',smage:'#cbc2d8',knight:'#5b6068',commander:'#e4dac4'};
function drawSkel(c,e,t,o){
  const r=e.r,ty=e.type,bone=SKPAL[ty]||'#ddd5c2',f=o.face||0,step=o.moving?Math.sin(t*12+e.x*.07):0;
  c.save();c.translate(e.x,e.y);c.fillStyle='rgba(0,0,0,.38)';ell(c,0,r*.5,r,r*.38);c.fill();
  c.translate(0,-r*.3-Math.abs(step)*1.2);c.save();c.rotate(f);const k=r/13;c.scale(k,k);
  if(ty==='hound'){c.strokeStyle=bone;c.lineWidth=2.2;c.beginPath();for(const lx of[-7,5])for(const sd of[-1,1]){c.moveTo(lx,sd*3);c.lineTo(lx+step*3*sd,sd*10)}c.stroke();
    c.lineWidth=3.2;c.beginPath();c.moveTo(-14,0);c.lineTo(8,0);c.stroke();c.lineWidth=1.5;for(let i=-5;i<=3;i+=3){c.beginPath();c.moveTo(i,-4);c.quadraticCurveTo(i+1,0,i,4);c.stroke()}
    c.beginPath();c.moveTo(-14,0);c.lineTo(-19,-3+step*2);c.stroke();c.fillStyle=bone;ell(c,12,0,6.5,5);c.fill();c.fillRect(16,-2.2,5,4.4);c.fillStyle='#ff4a3a';ell(c,14,-2.2,1.3,1.3);c.fill();ell(c,14,2.2,1.3,1.3);c.fill()}
  else{
    if(ty==='commander'){c.fillStyle='#8a1f1f';c.beginPath();c.moveTo(-3,-11);c.quadraticCurveTo(-22+Math.sin(t*5)*2,0,-3,11);c.closePath();c.fill()}
    c.fillStyle='#8f877a';ell(c,-2+step*3,5.5,3,2.2);c.fill();ell(c,-2-step*3,-5.5,3,2.2);c.fill();
    // 무기
    c.save();
    if(ty==='skel'){c.rotate(o.atk?.6:0);c.fillStyle='#7a6a55';c.fillRect(2,7.5,5,3);c.fillStyle='#b8bec4';c.fillRect(7,8,14,2)}
    else if(ty==='shield'){c.fillStyle='#b8bec4';c.fillRect(4,7.5,10,2);c.fillStyle='#5a4532';ell(c,9,-1,3.5,9.5);c.fill();c.strokeStyle='#9aa1a8';c.lineWidth=1.4;c.stroke();c.fillStyle='#c9cdd2';ell(c,10,-1,1.5,1.5);c.fill()}
    else if(ty==='sarcher'){c.strokeStyle='#6b5236';c.lineWidth=2.2;c.beginPath();c.arc(5,0,12,-1.05,1.05);c.stroke();c.strokeStyle='rgba(230,225,210,.7)';c.lineWidth=.8;c.beginPath();c.moveTo(5+12*Math.cos(-1.05),12*Math.sin(-1.05));c.lineTo(3,0);c.lineTo(5+12*Math.cos(1.05),12*Math.sin(1.05));c.stroke()}
    else if(ty==='smage'){c.strokeStyle='#4a3a2a';c.lineWidth=2.2;c.beginPath();c.moveTo(-3,8);c.lineTo(20,8);c.stroke();const g=c.createRadialGradient(22,8,0,22,8,7);g.addColorStop(0,'#fff');g.addColorStop(.4,'#a070e0');g.addColorStop(1,'rgba(160,112,224,0)');c.fillStyle=g;ell(c,22,8,7,7);c.fill()}
    else if(ty==='knight'){c.strokeStyle='#9aa1a8';c.lineWidth=2.4;c.beginPath();c.moveTo(-6,7);c.lineTo(30,7);c.stroke();c.fillStyle='#c9cdd2';c.beginPath();c.moveTo(30,4.5);c.lineTo(36,7);c.lineTo(30,9.5);c.fill()}
    else if(ty==='commander'){c.fillStyle='#3a2a1a';c.fillRect(0,7,7,3.4);c.fillStyle='#c9a24a';c.fillRect(6,4,3,10);c.fillStyle='#9aa4ae';c.beginPath();c.moveTo(9,6.2);c.lineTo(34,7);c.lineTo(37,8.7);c.lineTo(34,10.4);c.lineTo(9,11.2);c.closePath();c.fill()}
    c.restore();
    // 몸통(갈비뼈)
    c.fillStyle=ty==='knight'?'#4b5058':ty==='commander'?'#3b3f46':bone;ell(c,0,0,7.5,10);c.fill();
    if(ty!=='knight'&&ty!=='commander'){c.strokeStyle='rgba(40,30,25,.55)';c.lineWidth=1;for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(-4,i*3.2);c.lineTo(4,i*3.2);c.stroke()}}

    if(ty==='smage'){c.fillStyle='#3b2a55';ell(c,-1,0,7,9.5);c.fill()}
    // 해골
    c.fillStyle=bone;ell(c,2,0,6.2,6.2);c.fill();
    if(ty==='knight'||ty==='commander'){c.fillStyle=ty==='commander'?'#2f333a':'#5b6068';c.beginPath();c.arc(1,0,6.8,Math.PI*.45,Math.PI*1.55);c.fill();if(ty==='commander'){c.fillStyle='#c9a24a';for(const yy of[-5,0,5]){c.beginPath();c.moveTo(-3,yy-1.5);c.lineTo(-8,yy);c.lineTo(-3,yy+1.5);c.fill()}}}
    if(ty==='smage'){c.fillStyle='#3b2a55';c.beginPath();c.arc(1,0,6.8,Math.PI*.4,Math.PI*1.6);c.fill()}
    c.fillStyle='#1a1414';ell(c,5,-2.3,1.7,1.5);c.fill();ell(c,5,2.3,1.7,1.5);c.fill();c.fillStyle='#ff4a3a';ell(c,5.4,-2.3,.8,.8);c.fill();ell(c,5.4,2.3,.8,.8);c.fill()}

    else if(!dead){for(const e of G.enemies){if(e.dead||pr.hitSet.has(e))continue;if(Math.hypot(e.x-pr.x,e.y-pr.y)<pr.r+e.r){pr.hitSet.add(e);pr.onHit(e,pr);if(!pr.pierce){dead=true;break}}}}
    if(dead){if(pr.explode){sfx('explode',.05);G.fx.push({k:'ring',x:pr.x,y:pr.y,r0:6,r1:pr.explode.r,t:0,dur:.3,color:'#ffb0f0'});for(const e of inCircle(pr.x,pr.y,pr.explode.r))if(!pr.hitSet.has(e))pr.explode.fn(e)}
      if(!pr.hostile)burst(pr.x,pr.y,pr.color,4,60,2);G.projs.splice(i,1)}}

jz.addEventListener('pointerdown',e=>{if(joy.active)return;e.preventDefault();try{jz.setPointerCapture(e.pointerId)}catch(_){}const L=toLocal(e.clientX,e.clientY);joy.active=true;joy.id=e.pointerId;joy.bx=L.x;joy.by=L.y;joy.x=joy.y=0;joyEl.style.left=(L.x-jz.offsetLeft)+'px';joyEl.style.top=(L.y-jz.offsetTop)+'px';joyEl.classList.add('on')});
jz.addEventListener('pointermove',e=>{if(!joy.active||e.pointerId!==joy.id)return;const L=toLocal(e.clientX,e.clientY);let dx=L.x-joy.bx,dy=L.y-joy.by;const l=Math.hypot(dx,dy),R=44*UI;if(l>R){dx=dx/l*R;dy=dy/l*R}joy.x=dx/R;joy.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.active=false;joy.id=null;joy.x=joy.y=0;joyRest()};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);
const btnEls=[0,1,2,3].map(i=>$('#btn'+i));
function setupButtons(){
  curSkills().forEach((sk,i)=>{const el=btnEls[i];el.innerHTML=`${svgI(sk.ico||sk.key)}<span class="nm">${sk.short||sk.name.replace(' 마법','')}</span><div class="cd"></div><div class="ct"></div><span class="mana">${sk.mana}</span><span class="lvb">${curLv(i)}</span>`;el._ct=el.querySelector('.ct');el._k=null;el._nomp=null;el._rd=null});
  $('#btnAtk').innerHTML=`${svgI('atk')}<span class="nm">공격</span>`;
  const pc=$('#portraitCv').getContext('2d');pc.setTransform(1,0,0,1,0,0);pc.clearRect(0,0,108,108);pc.save();pc.translate(54,62);pc.scale(2.6,2.6);drawHero(pc,G.cls,0,0,Math.PI/2,0,{form:G.form});pc.restore();
  hudCache={};joyRest();
}
function refreshBtnLevels(){if(!G)return;curSkills().forEach((sk,i)=>{const lb=btnEls[i].querySelector('.lvb');if(lb)lb.textContent=curLv(i)})}
const aimStates={};
function bindBtn(el,idx){
  el.addEventListener('pointerdown',e=>{if(!G||paused)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}const st={id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0,aiming:false,idx};aimStates[e.pointerId]=st;el.classList.add('press');
    if(idx<0){G.atkHold=st;G.atkTap=true}else G.aimSkill=st});
  el.addEventListener('pointermove',e=>{const st=aimStates[e.pointerId];if(!st)return;const d=dLocal(e.clientX-st.sx,e.clientY-st.sy);st.dx=d.x;st.dy=d.y;if(Math.hypot(st.dx,st.dy)>16)st.aiming=true});
  const end=(e,cancel)=>{const st=aimStates[e.pointerId];if(!st)return;delete aimStates[e.pointerId];el.classList.remove('press');if(!G)return;
    if(idx<0){if(G.atkHold===st)G.atkHold=null}else{if(G.aimSkill===st)G.aimSkill=null;if(!cancel){const l=Math.hypot(st.dx,st.dy);castSkill(idx,st.aiming?{manual:true,dx:st.dx/l,dy:st.dy/l,mag:clamp(l/100,.15,1)}:null)}}};
  el.addEventListener('pointerup',e=>end(e,false));el.addEventListener('pointercancel',e=>end(e,true));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn($('#btnAtk'),-1);btnEls.forEach((el,i)=>bindBtn(el,i));
function mouseAim(){if(!G)return null;const S=clamp(VH/370,.8,1.6);const wx=G.cam.x+(mouse.x-VW/2)/S,wy=G.cam.y+(mouse.y-VH/2)/S;const dx=wx-G.p.x,dy=wy-G.p.y,l=Math.hypot(dx,dy)||1;return{manual:true,dx:dx/l,dy:dy/l,mag:1,dist:l}}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&state==='game'){mouse.down=true;const L=toLocal(e.clientX,e.clientY);mouse.x=L.x;mouse.y=L.y}});
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const L=toLocal(e.clientX,e.clientY);mouse.x=L.x;mouse.y=L.y}});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouse.down=false});
addEventListener('keydown',e=>{keys[e.code]=true;if(state!=='game'||!G)return;const n={Digit1:0,Digit2:1,Digit3:2,Digit4:3}[e.code];if(n!=null){const a=mouseAim();const sk=curSkills()[n];if(a&&sk.range)a.mag=clamp(a.dist/sk.range,.15,1);castSkill(n,a)}if(e.code==='Escape')togglePause()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(state==='game'&&!paused)togglePause()});
$('#pauseBtn').addEventListener('click',()=>togglePause());
$('#resumeBtn').addEventListener('click',()=>togglePause(false));
$('#giveupBtn').addEventListener('click',()=>{$('#giveupNote').hidden=false});
$('#giveupYes').addEventListener('click',()=>{$('#pause').hidden=true;paused=false;endRun(false);$('#rTitle').textContent='원정 포기';});
function renderPauseSkills(){if(!G)return;$('#pauseSp').textContent=`${G.def.name} Lv ${G.hero.level} · 남은 스킬포인트 ${G.hero.sp}`;$('#pauseSkills').innerHTML=G.form?presetRows(G.cls,G.hero,G.form):skillRows(G.cls,G.hero);refreshBtnLevels()}
function togglePause(v){if(state!=='game'||!G||G.over)return;paused=v==null?!paused:v;$('#pause').hidden=!paused;$('#giveupNote').hidden=true;if(paused){renderPauseSkills();G.atkHold=null;G.aimSkill=null;joy.active=false;joyRest()}}

// ================= MENU BACKDROP =================
const bgSlimes=Array.from({length:7},(_,i)=>({x:Math.random(),y:.55+Math.random()*.4,r:rand(10,22),el:pick(['grass','water','fire','poison','grass','elec']),ph:Math.random(),sp:rand(.4,.8),dir:Math.random()<.5?-1:1}));
function renderMenuBg(t){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0b1214');g.addColorStop(1,'#16241f');c.fillStyle=g;c.fillRect(0,0,VW,VH);
  c.fillStyle='rgba(127,224,255,.05)';for(let i=0;i<14;i++){const x=(hash(i,3)*VW+t*6*(i%3+1))%VW,y=hash(i,7)*VH*.6;ell(c,x,y,1.5,1.5);c.fill()}
  for(const s of bgSlimes){s.ph+=1/60*s.sp*1.4;if(s.ph>=1){s.ph=0;s.x+=s.dir*.025;if(s.x<-.05||s.x>1.05)s.dir*=-1}drawSlime(c,s.x*VW,s.y*VH,s.r,slimeColor(s.el),t,{hop:s.ph<.5?s.ph*2:0,alpha:.5})}
  if(pv.width>1){const p=pvc;p.setTransform(DPR,0,0,DPR,0,0);const w=pv.width/DPR,h=pv.height/DPR;p.clearRect(0,0,w,h);const gg=p.createRadialGradient(w/2,h*.62,4,w/2,h*.62,Math.min(w,h)*.6);gg.addColorStop(0,'rgba(227,176,75,.18)');gg.addColorStop(1,'rgba(227,176,75,0)');p.fillStyle=gg;p.fillRect(0,0,w,h);
    p.save();p.translate(w/2,h*.58);const sc=Math.min(2.6,h/42);p.scale(sc,sc);drawHero(p,save.selected,0,0,Math.PI/2+Math.sin(t*.8)*.6,t,{form:(save.heroes[save.selected].preset||0),moving:false,swing:Math.max(0,Math.sin(t*1.6))>.95?1:0});p.restore()}
}

const DG_TINT={slime:'121,214,94',skeleton:'230,223,204',zombie:'154,208,74',empire:'110,150,230',hell:'255,96,48',tower:'255,232,160'};
const LD={el:$('#loader'),busy:false};
function ldTip(){const [h,t]=pick(TIPS);$('#ldTip').innerHTML=`<b>TIP · ${h}</b>${t}`}
function ldSet(v,step){$('#ldBar').style.transform=`scaleX(${clamp(v,0,1)})`;$('#ldPct').textContent=Math.round(clamp(v,0,1)*100)+'%';if(step)$('#ldStep').textContent=step}
const ldWait=ms=>new Promise(r=>setTimeout(r,ms));
function ldHide(){LD.el.classList.add('out');LD.busy=false}
async function bootLoad(){
  $('#ldVer').textContent='v'+VERSION;LD.el.dataset.mode='boot';LD.el.style.removeProperty('--lc');ldTip();LD.busy=true;
  if(window.__SKIPLOAD){ldHide();return}
  const steps=[['저장 데이터 불러오는 중…',.18],['글꼴 준비 중…',.42],['던전 지도 펼치는 중…',.66],['몬스터 깨우는 중…',.86],['준비 완료',1]];
  const fonts=document.fonts?Promise.race([document.fonts.ready,ldWait(2500)]):Promise.resolve();
  ldSet(.05);await ldWait(250);
  for(let i=0;i<steps.length;i++){const [t,v]=steps[i];ldSet(v,t);if(i===1)await fonts;await ldWait(i===steps.length-1?150:260+Math.random()*180)}
  if(document.fonts&&state==='menu')renderMenu();
  $('#ldTap').hidden=false;
  LD.el.addEventListener('pointerup',function go(){LD.el.removeEventListener('pointerup',go);auInit();sfx('click');ldHide();setTimeout(()=>{$('#ldTap').hidden=true},500)});
}
async function dungeonLoad(){
  if(LD.busy)return;
  if(window.__SKIPLOAD){startRun();return}
  const dk=DUNGEONS[save.dg]?save.dg:'slime',D=DUNGEONS[dk];LD.busy=true;
  LD.el.dataset.mode='dg';LD.el.style.setProperty('--lc',DG_TINT[dk]||'227,176,75');
  $('#ldTitle').textContent=D.name;$('#ldSub2').textContent=`${D.floors}층 · 권장 Lv ${D.rec}`;$('#ldInfo').textContent=`최심부의 주인 — ${D.bossName}`;
  $('#ldTap').hidden=true;ldTip();ldSet(0,'던전 입구로 향하는 중…');LD.el.classList.remove('out');
  await ldWait(60);ldSet(.3,'지하 통로 생성 중…');await ldWait(320);
  ldSet(.62,'몬스터 배치 중…');await ldWait(60);
  try{startRun();paused=true}catch(e){console.error(e)}
  await ldWait(280);ldSet(1,'입장!');await ldWait(380);ldHide();if(G)paused=false;
}

// ================= LOOP =================
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='menu')renderMenuBg(now/1000);
  else if(G){if(!paused&&!G.over)update(dt);else if(G.over&&!paused){G.time+=dt}render();if(!G.over||true){updateHud();G.miniT=(G.miniT||0)-dt;if(G.miniT<=0){G.miniT=.25;drawMini()}}}
  requestAnimationFrame(loop);
}
renderAudioBtns();music('menu');
$('#verTag').textContent='v'+VERSION;$('#verPause').textContent='v'+VERSION;
resize();renderMenu();sizePreview();joyRest();requestAnimationFrame(loop);bootLoad();
document.fonts&&document.fonts.ready.then(()=>{if(state==='menu')renderMenu()});
